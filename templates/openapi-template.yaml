openapi: 3.0.3
info:
  title: API Template
  version: 1.0.0
  description: Standardized API contract template.
servers:
  - url: https://api.example.com
paths:
  /v1/users:
    get:
      summary: List users
      operationId: listUsers
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
